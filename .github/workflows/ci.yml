name: API CI
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Build API
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnflow-api-build-logs
          path: |
            typecheck.log
            build.log
          retention-days: 3
      - run: npm prune --omit=dev
      - uses: actions/upload-artifact@v4
        with:
          name: learnflow-api-runtime
          path: |
            dist
            node_modules
            package.json
            render.yaml
          if-no-files-found: error
          retention-days: 3

name: Reminder Scheduler

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger LearnFlow reminder cycle
        env:
          LEARNFLOW_API_URL: ${{ secrets.LEARNFLOW_API_URL }}
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          test -n "$LEARNFLOW_API_URL"
          test -n "$REMINDER_CRON_SECRET"
          curl --fail --silent --show-error \
            -X POST "${LEARNFLOW_API_URL%/}/api/v1/system/run-reminders" \
            -H "x-cron-secret: ${REMINDER_CRON_SECRET}"
